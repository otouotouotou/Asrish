org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
# AGP 9.x の組み込み Kotlin は使わず、従来通り
# org.jetbrains.kotlin.android プラグイン (2.2.10) でビルドする。
# newDsl=false も必須: AGP 9 の新 DSL では旧 BaseExtension が無効化され、
# Kotlin プラグイン側のキャストが ClassCastException で落ちる
android.builtInKotlin=false
android.newDsl=false
